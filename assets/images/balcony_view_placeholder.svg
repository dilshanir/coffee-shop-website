<svg viewBox="0 0 800 600" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#F3ECE2"/>
  <rect x="20" y="20" width="760" height="560" rx="12" fill="none" stroke="#E6DDD2" stroke-width="2" stroke-dasharray="8 8"/>
  
  <!-- Subtle line illustration: 5th Floor Balcony railing overlooking water and skyline -->
  <g stroke="#6E6157" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.75">
    <!-- Gentle Beira Lake water lines -->
    <path d="M120 380 Q 250 370, 380 380 T 680 380" stroke="#7C8D78" stroke-width="1.5" opacity="0.5"/>
    <path d="M160 410 Q 290 400, 420 410 T 640 410" stroke="#7C8D78" stroke-width="1.5" opacity="0.4"/>
    
    <!-- Distant Colombo tree line & subtle silhouettes -->
    <path d="M180 340 L 220 340 L 220 310 L 250 310 L 250 350 L 320 350" opacity="0.3"/>
    <path d="M420 350 L 450 350 L 450 290 L 480 290 L 480 350" opacity="0.3"/>
    <path d="M540 350 C 560 320, 590 320, 610 350" stroke="#7C8D78" opacity="0.4"/>

    <!-- Balcony Railing in Foreground -->
    <line x1="120" y1="440" x2="680" y2="440" stroke-width="3"/>
    <line x1="120" y1="480" x2="680" y2="480" stroke-width="2"/>
    <line x1="180" y1="440" x2="180" y2="520"/>
    <line x1="280" y1="440" x2="280" y2="520"/>
    <line x1="380" y1="440" x2="380" y2="520"/>
    <line x1="480" y1="440" x2="480" y2="520"/>
    <line x1="580" y1="440" x2="580" y2="520"/>

    <!-- Warm Terrace Lantern -->
    <path d="M370 410 L390 410 L395 440 L365 440 Z" fill="#7C8D78" opacity="0.25"/>
    <ellipse cx="380" cy="425" rx="4" ry="7" fill="#7C8D78" opacity="0.6"/>
  </g>

  <!-- Calm Editorial Tag -->
  <text x="400" y="530" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#6E6157" letter-spacing="1.5">
    [PLACEHOLDER] 5TH FLOOR BALCONY &amp; DUSK SKYLINE
  </text>
  <text x="400" y="555" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="16" font-style="italic" fill="#9E9186">
    Gentle breezes and sunset twilight across Beira Lake
  </text>
</svg>
